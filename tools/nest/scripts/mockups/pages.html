<!doctype html><meta charset="utf-8"><title>Nest pages mockups</title>
<!-- Mockups for Agenda (item_226), MRs (item_225), Reports (item_258).
     ?p=agenda|mrs|reports&v=A|B|C&f=laptop|phone. Look follows the Ops sketch (item_190).
     Data: shapes of /api/state/today, /api/state/mrs, review ledgers, vault rituals; names made generic. -->
<style>
*{box-sizing:border-box}html,body{margin:0;background:#1e2030;color:#cad3f5;font:13px/1.4 'Fira Code',monospace}
.lap{width:1440px;height:900px;display:grid;grid-template-rows:56px 1fr;grid-template-columns:1fr 320px;overflow:hidden;position:relative}
.top{grid-column:1/-1;display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid #363a4f;letter-spacing:.08em}
.top .lg{font-family:Michroma,sans-serif;color:#c6a0f6;font-size:18px}.top .on{background:#c6a0f6;color:#181926;padding:4px 10px;border-radius:6px}
.main{grid-row:2;grid-column:1;min-width:0;min-height:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.rail{grid-row:2;grid-column:2;border-left:1px solid #494d64;background:#181926;padding:12px 14px;display:flex;flex-direction:column;gap:10px;color:#6e738d}
.rail .hd{height:230px;border:1px dashed #494d64;border-radius:8px;display:grid;place-items:center}
.hd1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hd1 h1{font:16px Michroma,sans-serif;margin:0 6px 0 0;letter-spacing:.08em}
.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{border:1px solid #494d64;border-radius:6px;padding:3px 9px;font-size:11.5px;white-space:nowrap}.tab.on{background:#c6a0f6;color:#181926;border-color:#c6a0f6}
.pn{border:1px solid #494d64;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;overflow:hidden;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.c-w{color:#7dc4e4}.c-n{color:#eed49f}.c-f{color:#ed8796}.c-g{color:#a6da95}.c-s{color:#8087a2}.c-m{color:#c6a0f6}.c-t{color:#8bd5ca}
.row{display:flex;align-items:center;gap:8px;background:#24273a;border-radius:7px;padding:5px 9px;font-size:12px;flex-wrap:wrap;min-width:0}
.row .t{flex:1 1 160px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{font-size:11px;color:#a5adcb;white-space:nowrap}
.row.sel{box-shadow:0 0 0 1px #c6a0f6 inset}.row .tm{color:#a5adcb;font-size:11.5px;width:44px;flex:0 0 auto}
.row.dim{opacity:.55}
.btn{border:1px solid #494d64;border-radius:6px;padding:1px 7px;font-size:11px;white-space:nowrap}.btn.p{background:#c6a0f6;color:#181926;border-color:#c6a0f6}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #494d64;border-radius:999px;padding:2px 10px;font-size:11.5px;white-space:nowrap}
.chip.warn{border-color:#eed49f;color:#eed49f}.chip.fail{border-color:#ed8796;color:#ed8796}.chip.ok{border-color:#a6da95;color:#a6da95}.chip.run{border-color:#7dc4e4;color:#7dc4e4}.chip.m{border-color:#c6a0f6;color:#c6a0f6}
.g{font-size:10.5px;color:#c6a0f6;letter-spacing:.12em;margin-top:4px;border-top:1px solid #363a4f;padding-top:4px;text-transform:uppercase;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12px}.kv span:nth-child(odd){color:#a5adcb}
.note{position:absolute;z-index:5;background:#eed49f;color:#181926;font:11px/1.35 'Fira Code',monospace;padding:5px 8px;border-radius:6px;max-width:260px;box-shadow:0 2px 8px #0008}
.lbl{position:absolute;left:16px;bottom:10px;z-index:9;background:#eed49f;color:#181926;font:12px Michroma,sans-serif;padding:4px 10px;border-radius:6px;letter-spacing:.08em}
table{border-collapse:collapse;width:100%;font-size:12px}th{font-weight:400;color:#a5adcb;text-align:left;padding:3px 6px;font-size:11px;letter-spacing:.06em}td{padding:4px 6px;border-top:1px solid #363a4f;white-space:nowrap}
.bar{display:inline-block;height:8px;background:#c6a0f6;border-radius:2px;vertical-align:middle;margin-right:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7dc4e4;box-shadow:0 0 6px #7dc4e4}
/* hour grid */
.hg{position:relative;display:grid;grid-template-columns:46px 1fr;font-size:11px}
.hg .h{color:#a5adcb;height:var(--rh);border-top:1px solid #363a4f;padding-top:1px}.hg .c{border-top:1px solid #363a4f;height:var(--rh)}
.ev{position:absolute;left:52px;right:6px;border-radius:6px;padding:3px 8px;font-size:11.5px;overflow:hidden;background:#7dc4e422;border-left:3px solid #7dc4e4}
.ev.done{opacity:.5}.ev.next{background:#c6a0f62a;border-left-color:#c6a0f6}
.nowl{position:absolute;left:46px;right:0;height:2px;background:#ed8796;z-index:2}.nowl b{position:absolute;right:4px;top:-14px;font-size:10px;color:#ed8796;font-weight:400}
.wg{display:grid;gap:0 6px}.wg .dh{font-size:11.5px;color:#b8c0e0;padding:4px 6px;border-radius:6px}.wg .dh.on{background:#c6a0f6;color:#181926}
.wg .col{position:relative;border-left:1px solid #363a4f;background:repeating-linear-gradient(180deg,#363a4f55 0 1px,transparent 1px var(--rh))}
.wg .ad{font-size:10.5px;color:#a5adcb;border:1px dashed #494d64;border-radius:5px;padding:1px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wg .ev{left:3px;right:3px;font-size:10.5px;padding:2px 5px;border-left-width:2px}
.due{display:block;font-size:10.5px;border-radius:5px;padding:1px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#eed49f22;color:#eed49f;border-left:2px solid #eed49f}
.due.mr{background:#8bd5ca22;color:#8bd5ca;border-left-color:#8bd5ca}.due.dt{background:#f5a97f22;color:#f5a97f;border-left-color:#f5a97f}
.stg{display:flex;gap:4px;flex-wrap:wrap}.stg span{border-radius:5px;padding:1px 7px;font-size:11px;border:1px solid #494d64}.stg .ok{border-color:#a6da95;color:#a6da95}.stg .ko{border-color:#ed8796;color:#ed8796;background:#ed879622}.stg .sk{color:#6e738d;border-style:dashed}
.q{border-left:2px solid #494d64;padding:2px 8px;font-size:11.5px;color:#b8c0e0}
.md{font-size:12.5px;line-height:1.55;color:#cad3f5}.md h2{font:13px Michroma,sans-serif;letter-spacing:.06em;color:#c6a0f6;margin:12px 0 4px}.md h3{font-size:12px;color:#8bd5ca;margin:10px 0 2px;font-weight:400;letter-spacing:.1em;text-transform:uppercase}.md ul{margin:2px 0;padding-left:18px}.md p{margin:4px 0}
.tile{border:1px solid #494d64;border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}.tile .n{font:13px Michroma,sans-serif;letter-spacing:.06em}.tile.run{border-color:#7dc4e4;background:#7dc4e414}
.k{display:inline-grid;place-items:center;width:18px;flex:0 0 auto}
/* phone */
.ph-wrap{width:368px;padding:0 0 8px}.ph-lbl{font:13px Michroma,sans-serif;color:#c6a0f6;padding:6px 2px 4px;letter-spacing:.06em}
.phone{width:368px;min-height:812px;border:1px solid #494d64;border-radius:22px;padding:12px 10px 0;display:flex;flex-direction:column;gap:8px;background:#1e2030;overflow:hidden}
.phone .bar0{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-family:Michroma,sans-serif;font-size:12px}
.phone .bar0 .chip{font-family:'Fira Code',monospace;font-size:11px;padding:1px 8px}
.phone .hd1 h1{font-size:14px}.phone .pn{padding:8px 9px;border-radius:10px}.phone .row{padding:6px 8px}.phone .row .t{flex-basis:120px}
.phone .fill{flex:1}
.nav{display:flex;justify-content:space-around;border-top:1px solid #363a4f;margin:0 -10px;padding:10px 0 12px;font-size:12px;color:#8087a2}.nav .on{color:#c6a0f6}
.cap{font-size:12px;color:#eed49f;padding:6px 2px 0;line-height:1.4}
.sheet{border:1px solid #c6a0f6;border-radius:14px 14px 0 0;background:#24273a;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 -6px 18px #0009}
.grab{width:40px;height:4px;border-radius:2px;background:#5b6078;margin:0 auto 4px}
</style>
<body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),P=Q.get('p')||'agenda',V=(Q.get('v')||'A').toUpperCase(),F=Q.get('f')||'laptop'
const NAV=[['HOME'],['DESK'],['OPS',2],['INBOX',8],['MRS',4],['AGENDA'],['REPORTS']]
const NOW='15:39',TODAY='Tue 24 Nov'
const note=(x,y,t)=>`<div class="note" style="left:${x}px;top:${y}px">${t}</div>`
function lap(page,main,notes,label){
 return `<div class="lap"><div class="top"><span class="lg">CR-0W</span>${NAV.map((n,i)=>`<span class="${n[0]===page?'on':''}">${i+1} ${n[0]}${n[1]?' '+n[1]:''}</span>`).join('')}<span style="margin-left:auto">MAIN ▮▮▮ 72% · WORK ▮▮▯ 41%</span><span>${NOW}</span></div>
 <div class="main">${main}</div><aside class="rail"><div>● OK · CR-0W</div><div class="hd">droid head</div><div>cr-0w › rail unchanged from Ops.</div><div style="flex:1;border:1px dashed #363a4f;border-radius:8px;display:grid;place-items:center">butler chat (unchanged)</div><div style="border:1px solid #494d64;border-radius:8px;padding:8px">Talk to CR-0W…</div></aside>${notes}<div class="lbl">${label}</div></div>`}
function phone(main,label,cap){
 return `<div class="ph-wrap"><div class="ph-lbl">${label}</div><div class="phone"><div class="bar0"><span>CR-0W</span><span style="display:flex;gap:6px"><span class="chip warn">◆ 8</span><span class="chip run">⟳ 2</span></span></div>${main}<div class="fill"></div><div class="nav"><span>Home</span><span>Desk</span><span>Ops</span><span>Inbox</span><span class="on">More ▴</span></div></div><div class="cap">${cap}</div></div>`}

/* ---------- AGENDA ---------- */
// today.json shape: events / tomorrow / week {start,end,subject,all_day,next}. Due: Open Threads dates, Inbox followup, sprint/release dates, MR waits.
const DAYS=[
 {d:'Tue 24',t:1,ad:'Office',ev:[['11:30','12:00','Team daily','done'],['16:00','17:00','Presentation review','next']],due:[['th','Nest Settings: pick a layout','thread · due today'],['mr','!242 review waits 4 days','MR · to review']]},
 {d:'Wed 25',ad:'Office',ev:[['11:30','12:00','Team daily']],due:[['th','Reply: contract questions','follow-up · mail 19 Nov']]},
 {d:'Thu 26',ad:'Office',ev:[['11:00','11:30','Weekly prep'],['11:30','12:00','Team daily'],['17:00','17:30','HR point']],due:[['th','Sprint planning booked?','thread · check']]},
 {d:'Fri 27',ad:'Remote',ev:[['11:30','12:00','Team daily'],['12:00','12:30','Company weekly']],due:[['dt','Sprint ends','sprint date'],['dt','Weekly rollup','ritual · Friday']]},
 {d:'Sat 28',ev:[],due:[]},{d:'Sun 29',ev:[],due:[]},
 {d:'Mon 30',ad:'Office',ev:[['09:30','10:00','Log office presence'],['10:30','11:00','Management weekly'],['11:30','12:00','Team daily']],due:[['th','1:1s due this week','thread · management']]},
]
const KI={th:['◆','c-n'],mr:['⇄','c-t'],dt:['⚑','c-f'],ev:['◷','c-w']}
const mm=t=>{const[a,b]=t.split(':');return +a*60+ +b}
const dueRow=(x,ph)=>`<div class="row"><span class="k ${KI[x[0]][1]}">${KI[x[0]][0]}</span><span class="t">${x[1]}</span><span class="s">${x[2]}</span>${x[0]==='dt'?'<span class="btn">OPEN</span>':x[0]==='mr'?'<span class="btn">REVIEW</span>':`<span class="btn">OPEN</span><span class="btn">SNOOZE ▾</span>`}</div>`
const evRow=(e,o={})=>`<div class="row ${e[3]==='done'?'dim':''} ${e[3]==='next'?'sel':''}"><span class="tm">${e[0]}</span><span class="k c-w">◷</span><span class="t">${e[2]}</span><span class="s">${(mm(e[1])-mm(e[0]))} min${e[3]==='next'?' · in 21 min':''}</span>${e[3]==='done'?'<span class="btn">NOTES</span>':'<span class="btn">NOTES</span><span class="btn'+(e[3]==='next'?' p':'')+'">PREP</span>'}</div>`
const nextCard=(c)=>`<div class="pn" style="border-color:#c6a0f6;flex:0 0 auto"><div class="ph"><span class="c-m">Next · in 21 min</span><span class="c-s">16:00 → 17:00</span></div>
 <div style="font:14px Michroma,sans-serif;letter-spacing:.04em">Presentation review</div>
 <div class="kv"><span>where</span><span>video call · 4 people</span><span>prep</span><span class="c-n">todo · notes page exists</span>${c?'':`<span>context</span><span>deck v3 in Drafts · 2 open threads mention it</span>`}</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap"><span class="btn p">PREP SESSION</span><span class="btn">OPEN NOTES</span><span class="btn">JOIN ↗</span></div></div>`
function dayGrid(ev,h0,h1,rh,nowAt){let h=`<div class="hg" style="--rh:${rh}px">`
 for(let x=h0;x<h1;x++)h+=`<span class="h">${String(x).padStart(2,'0')}:00</span><span class="c"></span>`
 ev.forEach(e=>{const top=(mm(e[0])-h0*60)/60*rh,ht=Math.max((mm(e[1])-mm(e[0]))/60*rh-2,16);h+=`<div class="ev ${e[3]||''}" style="top:${top}px;height:${ht}px">${e[0]} ${e[2]}</div>`})
 if(nowAt)h+=`<div class="nowl" style="top:${(mm(nowAt)-h0*60)/60*rh}px"><b>now ${nowAt}</b></div>`
 return h+'</div>'}
function agenda(){
 const hdr=(x)=>`<div class="hd1"><h1>AGENDA</h1><span class="tabs">${x||'<span class="tab on">TODAY + 7 DAYS</span><span class="tab">WEEK</span>'}</span><span class="c-s">◀ ${TODAY} ▶</span><span style="margin-left:auto" class="c-s">today 2 meetings · 2 due · week 13 meetings · 7 due</span></div>`
 const legend=`<div style="display:flex;gap:14px;font-size:11px;color:#a5adcb;flex-wrap:wrap"><span><span class="c-w">◷</span> meeting</span><span><span class="c-n">◆</span> thread / follow-up (snooze)</span><span><span class="c-t">⇄</span> MR wait</span><span><span class="c-f">⚑</span> sprint / release date</span><span>times: Paris</span></div>`
 const D=DAYS[0]
 if(F==='laptop'){
  if(V==='A'){
   const week=DAYS.slice(1).map(d=>`<div class="g"><span>${d.d}${d.ad?' · '+d.ad:''}</span><span class="c-s">${d.ev.length} meetings${d.due.length?' · '+d.due.length+' due':''}</span></div>${d.due.map(x=>dueRow(x)).join('')}${d.ev.map(e=>evRow(e)).join('')}${!d.ev.length&&!d.due.length?'<div class="c-s" style="font-size:11px;padding:2px 4px">nothing</div>':''}`).join('')
   return lap('AGENDA',hdr()+`<div style="display:flex;gap:10px;flex:1;min-height:0">
    <div style="flex:1.05;display:flex;flex-direction:column;gap:10px;min-width:0">${nextCard()}
     <div class="pn" style="flex:1"><div class="ph"><span>Today · ${TODAY} · ${D.ad}</span><span class="c-s">08:00 to 19:00</span></div>
      <div class="g" style="margin:0"><span>due today</span><span class="c-s">2</span></div>${D.due.map(x=>dueRow(x)).join('')}
      ${dayGrid(D.ev,8,19,30,NOW)}</div></div>
    <div class="pn" style="flex:1"><div class="ph"><span>Next 7 days</span><span class="c-s">${DAYS.slice(1).reduce((a,d)=>a+d.ev.length,0)} meetings · 5 due</span></div>${week}${legend}</div></div>`,
    note(300,140,'Next meeting card on top: PREP starts a session with its context, NOTES opens the vault note.')+note(1000,150,'Next 7 days as a list per day: due items first, then meetings.'),'A · TODAY HOUR GRID + NEXT 7 DAYS LIST')}
  if(V==='B'){
   const cols=DAYS.map(d=>d.ev.length||d.due.length?'1fr':'.45fr').join(' '),h0=9,h1=19,rh=40
   let g=`<div class="wg" style="grid-template-columns:${cols};--rh:${rh}px">`
   DAYS.forEach(d=>g+=`<span class="dh ${d.t?'on':''}">${d.d}</span>`)
   DAYS.forEach(d=>g+=`<div style="min-height:24px;padding:2px 3px">${d.ad?`<span class="ad">${d.ad}</span>`:''}</div>`)
   DAYS.forEach(d=>g+=`<div style="min-height:46px;padding:2px 3px">${d.due.map(x=>`<span class="due ${x[0]==='mr'?'mr':x[0]==='dt'?'dt':''}">${KI[x[0]][0]} ${x[1]}</span>`).join('')}</div>`)
   DAYS.forEach(d=>{g+=`<div class="col" style="height:${(h1-h0)*rh}px">${d.ev.map(e=>`<div class="ev ${e[3]||''}" style="top:${(mm(e[0])-h0*60)/60*rh}px;height:${Math.max((mm(e[1])-mm(e[0]))/60*rh-2,16)}px">${e[0]} ${e[2]}</div>`).join('')}${d.t?`<div class="nowl" style="left:0;top:${(mm(NOW)-h0*60)/60*rh}px"><b>now</b></div>`:''}</div>`})
   g+='</div>'
   const hours=`<div style="display:flex;flex-direction:column;padding-top:${24+46+30}px;font-size:10.5px;color:#a5adcb;width:40px">${[...Array(h1-h0)].map((_,i)=>`<span style="height:${rh}px">${String(h0+i).padStart(2,'0')}:00</span>`).join('')}</div>`
   return lap('AGENDA',hdr('<span class="tab">TODAY + 7 DAYS</span><span class="tab on">WEEK</span>')+`<div class="pn" style="flex:0 0 auto"><div class="ph"><span>Week 48 · ${TODAY} → Mon 30</span><span class="c-s">click a block or a due chip</span></div><div style="display:flex;gap:4px">${hours}<div style="flex:1;min-width:0">${g}</div></div>${legend}</div>
    <div style="display:flex;gap:10px;flex:1;min-height:0"><div class="pn" style="flex:1">${nextCard(1).replace('class="pn" style="border-color:#c6a0f6;flex:0 0 auto"','')}</div>
    <div class="pn" style="flex:1.3"><div class="ph"><span>Due this week</span><span class="c-s">7 · snooze moves to a later day</span></div>${DAYS.flatMap(d=>d.due.map(x=>dueRow([x[0],x[1],d.d+' · '+x[2]]))).slice(0,5).join('')}</div></div>`,
    note(560,95,'Due row per day on top of the week grid: threads, follow-ups, MR waits, sprint dates.')+note(330,700,'Bottom: selected block detail and the due list with SNOOZE.'),'B · WEEK GRID WITH A DUE ROW')}
  // C
  const rows=DAYS.map((d,i)=>`<div class="g"><span>${i===0?'Today · ':''}${d.d}${d.ad?' · '+d.ad:''}</span><span class="c-s">${d.ev.length} meetings${d.due.length?' · '+d.due.length+' due':''}</span></div>${!d.ev.length&&!d.due.length?'<div class="c-s" style="font-size:11px;padding:0 4px">nothing</div>':''}${d.due.map(x=>dueRow(['',...x].slice(1))).join('')}${d.ev.map(e=>evRow(e)).join('')}`).join('')
  return lap('AGENDA',hdr('<span class="tab on">ALL 20</span><span class="tab">MEETINGS 13</span><span class="tab">DUE 5</span><span class="tab">MRS 1</span><span class="tab">DATES 2</span>')+`<div style="display:flex;gap:10px;flex:1;min-height:0"><div class="pn" style="flex:1.6;overflow:hidden">${rows}</div>
   <div style="flex:1;display:flex;flex-direction:column;gap:10px;min-width:0">${nextCard()}<div class="pn"><div class="ph"><span>Snooze</span><span class="c-s">on a due row</span></div><div class="row sel"><span class="k c-n">◆</span><span class="t">Nest Settings: pick a layout</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="btn">+1 H</span><span class="btn p">TOMORROW</span><span class="btn">MON 30</span><span class="btn">PICK DAY</span></div><div class="c-s" style="font-size:11px">writes the new date to Open Threads</div></div>${legend}</div></div>`,
   note(240,95,'Filter chips by kind. One chronological list, 7 days, grouped by day.')+note(930,520,'Snooze menu shown open on a due thread.'),'C · ONE LIST BY DAY + FILTERS')}
 // phone
 const ph=`<div class="hd1"><h1>AGENDA</h1><span class="c-s" style="margin-left:auto">◀ Tue 24 ▶</span></div>`
 if(V==='A')return phone(ph+nextCard(1)+`<div class="pn"><div class="ph"><span>Today</span><span class="c-s">2 meetings · 2 due</span></div>${D.due.map(x=>dueRow(x)).join('')}${dayGrid(D.ev,10,18,26,NOW)}</div>
  <div class="pn"><div class="ph"><span>Next 7 days</span><span class="c-s">tap a day</span></div>${DAYS.slice(1).map(d=>`<div class="row"><span class="tm">${d.d}</span><span class="t c-s">${d.ev.length?d.ev.length+' meetings':'free'}${d.due.length?` · <span class="c-n">${d.due.length} due</span>`:''}</span><span class="s">${d.ev[0]?d.ev[0][0]+' '+d.ev[0][2]:''}</span></div>`).join('')}</div>`,'A · Today grid + next 7 days','Next meeting card, today as an hour grid with due items above it, then one line per day (tap opens the day).')

 if(V==='B')return phone(ph+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${['afk',...GEN.map(g=>g[0])].map(k=>{const g=GEN.find(x=>x[0]===k),run=g&&g[1].startsWith('running');return `<div class="tile ${run?'run':''}"><span class="n ${RT[k][1]}" style="font-size:11.5px">${RT[k][0]} ${RT[k][2]}</span><span class="c-s" style="font-size:10.5px">${(OUT.find(o=>o[0]===k)||[,'-'])[1]}</span>${k==='afk'?'<span class="c-s" style="font-size:10.5px">from afk runs</span>':run?'<span class="chip run" style="font-size:10.5px"><i class="dot"></i>3m</span>':'<span class="btn p" style="align-self:flex-start">↻ GEN</span>'}</div>`}).join('')}</div><div class="pn">${OUT.slice(0,5).map(o=>outRow(o)).join('')}</div>`,'B · Ritual tiles','2×3 ritual tiles with GENERATE, then the newest outputs. Tile tap filters the list.')
 return phone(ph+`<div style="display:flex;gap:6px"><span class="btn p">↻ GENERATE ▾</span><span class="chip run"><i class="dot"></i>weekly 3m</span></div>${reader(1)}<div style="display:flex;justify-content:space-between"><span class="btn">◀ AFK night</span><span class="btn">LIST ▾</span></div>`,'C · Reader first','Newest output open by default, ◀ walks back, LIST ▾ opens the timeline.')
}
document.getElementById('root').innerHTML={agenda,mrs,reports}[P]()
</script>
