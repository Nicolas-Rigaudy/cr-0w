<!doctype html><meta charset="utf-8"><title>Nest settings mockups</title>
<!-- Mockups for the Nest Settings page (req_066). ?v=A|B|C&f=laptop|phone.
     Look follows the pages mockups (Ops sketch, item_190). No chat rail: chat opens on demand.
     Data: modules/*.yaml (summary, default, requires) and nest-modules.ts value lists. -->
<style>
*{box-sizing:border-box}html,body{margin:0;background:#1e2030;color:#cad3f5;font:13px/1.4 'Fira Code',monospace}
.lap{width:1440px;height:900px;display:grid;grid-template-rows:56px 1fr;overflow:hidden;position:relative}
.top{display:flex;align-items:center;gap:22px;padding:0 20px;border-bottom:1px solid #363a4f;letter-spacing:.08em}
.top .lg{font-family:Michroma,sans-serif;color:#c6a0f6;font-size:18px}.top .on{background:#c6a0f6;color:#181926;padding:4px 10px;border-radius:6px}
.main{min-width:0;min-height:0;padding:12px 16px;display:flex;flex-direction:column;gap:10px;position:relative}
.hd1{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hd1 h1{font:16px Michroma,sans-serif;margin:0 6px 0 0;letter-spacing:.08em}
.tab{border:1px solid #494d64;border-radius:6px;padding:3px 9px;font-size:11.5px;white-space:nowrap}.tab.on{background:#c6a0f6;color:#181926;border-color:#c6a0f6}
.pn{border:1px solid #494d64;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-height:0;min-width:0;overflow:hidden;position:relative}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;letter-spacing:.1em;text-transform:uppercase;font-size:12px}
.c-w{color:#7dc4e4}.c-n{color:#eed49f}.c-f{color:#ed8796}.c-g{color:#a6da95}.c-s{color:#8087a2}.c-m{color:#c6a0f6}.c-t{color:#8bd5ca}
.row{display:flex;align-items:center;gap:8px;background:#24273a;border-radius:7px;padding:5px 9px;font-size:12px;min-width:0}
.row .t{flex:1 1 120px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .s{font-size:11px;color:#a5adcb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.sel{box-shadow:0 0 0 1px #c6a0f6 inset}.row.dim{opacity:.5}.row.chg{box-shadow:0 0 0 1px #eed49f inset}
.btn{border:1px solid #494d64;border-radius:6px;padding:1px 7px;font-size:11px;white-space:nowrap}.btn.p{background:#c6a0f6;color:#181926;border-color:#c6a0f6}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid #494d64;border-radius:999px;padding:2px 10px;font-size:11.5px;white-space:nowrap}
.chip.warn{border-color:#eed49f;color:#eed49f}.chip.fail{border-color:#ed8796;color:#ed8796}.chip.ok{border-color:#a6da95;color:#a6da95}.chip.run{border-color:#7dc4e4;color:#7dc4e4}.chip.m{border-color:#c6a0f6;color:#c6a0f6}
.g{font-size:10.5px;color:#c6a0f6;letter-spacing:.12em;margin-top:4px;border-top:1px solid #363a4f;padding-top:4px;text-transform:uppercase;display:flex;justify-content:space-between}
.note{position:absolute;z-index:5;background:#eed49f;color:#181926;font:11px/1.35 'Fira Code',monospace;padding:5px 8px;border-radius:6px;max-width:260px;box-shadow:0 2px 8px #0008}
.lbl{position:absolute;left:16px;bottom:10px;z-index:9;background:#eed49f;color:#181926;font:12px Michroma,sans-serif;padding:4px 10px;border-radius:6px;letter-spacing:.08em}
.sw{width:30px;height:16px;border-radius:999px;background:#494d64;position:relative;flex:0 0 auto}.sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#8087a2}
.sw.on{background:#c6a0f6}.sw.on::after{left:16px;background:#181926}.sw.lock{opacity:.4}
.hdl{color:#6e738d;cursor:grab;flex:0 0 auto}
.th{border:1px solid #494d64;border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:5px;min-width:0}.th.on{border-color:#c6a0f6;box-shadow:0 0 0 1px #c6a0f6}
.th .pv{height:74px;border-radius:6px;display:grid;grid-template-rows:12px 1fr;gap:4px;padding:5px;overflow:hidden}
.th .pv i{display:block;border-radius:3px}.th .n{font-size:11.5px;display:flex;justify-content:space-between}
.diff{font-size:11.5px;background:#181926;border-radius:7px;padding:6px 9px;line-height:1.6}.diff .m{color:#ed8796}.diff .p{color:#a6da95}
.log{font-size:11px;background:#181926;border-radius:7px;padding:6px 9px;line-height:1.5;color:#a5adcb;white-space:pre}
.save{display:flex;align-items:center;gap:10px;border:1px solid #eed49f;border-radius:10px;padding:8px 12px;background:#eed49f12}
.prog{height:6px;border-radius:3px;background:#363a4f;overflow:hidden}.prog i{display:block;height:100%;background:#7dc4e4}
/* phone */
.ph-wrap{width:368px;padding:0 0 8px}.ph-lbl{font:13px Michroma,sans-serif;color:#c6a0f6;padding:6px 2px 4px;letter-spacing:.06em}
.phone{width:368px;min-height:812px;border:1px solid #494d64;border-radius:22px;padding:12px 10px 0;display:flex;flex-direction:column;gap:8px;background:#1e2030;overflow:hidden;position:relative}
.phone .bar0{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-family:Michroma,sans-serif;font-size:12px}
.phone .bar0 .chip{font-family:'Fira Code',monospace;font-size:11px;padding:1px 8px}
.phone .hd1 h1{font-size:14px}.phone .pn{padding:8px 9px}.phone .row{padding:6px 8px}
.phone .fill{flex:1}
.nav{display:flex;justify-content:space-around;border-top:1px solid #363a4f;margin:0 -10px;padding:10px 0 12px;font-size:12px;color:#8087a2}.nav .on{color:#c6a0f6}
.cap{font-size:12px;color:#eed49f;padding:6px 2px 0;line-height:1.4}
</style>
<body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),V=(Q.get('v')||'A').toUpperCase(),F=Q.get('f')||'laptop'
const NAV=['HOME','DESK','OPS','INBOX','MRS','AGENDA','REPORTS']
const note=(x,y,t)=>`<div class="note" style="left:${x}px;top:${y}px">${t}</div>`
function lap(main,notes,label){
 return `<div class="lap"><div class="top"><span class="lg">CR-0W</span>${NAV.map((n,i)=>`<span>${i+1} ${n}</span>`).join('')}<span style="margin-left:auto">MAIN ▮▮▮ 72% · WORK ▮▮▯ 41%</span><span>15:39</span><span class="on">⚙ SETTINGS</span></div>
 <div class="main">${main}</div>${notes}<div class="lbl">${label}</div></div>`}
function phone(main,label,cap,nav=true){
 return `<div class="ph-wrap"><div class="ph-lbl">${label}</div><div class="phone"><div class="bar0"><span>CR-0W</span><span style="display:flex;gap:6px"><span class="chip warn">◆ 8</span><span class="chip run">⟳ 2</span></span></div>${main}<div class="fill"></div>${nav?'<div class="nav"><span>Home</span><span>Desk</span><span>Ops</span><span>Inbox</span><span class="on">More ▴</span></div>':''}</div><div class="cap">${cap}</div></div>`}

/* data: theme cyber picked (pending), pages reordered (agenda moved up), reports hidden */
const THEMES=[['modern','engine',['#1e2030','#c6a0f6','#8bd5ca','#24273a']],['cyber','engine',['#0b0f14','#39ff88','#ff3fa4','#121a22']]]
const CUR={theme:'modern',hero:'holotable'},NEW={theme:'cyber',hero:'holotable'}
const HEROES=[['holotable','engine','droid head on the holo table'],['none','engine','no hero, more room for panels']]
const PAGES=[['home',1,0],['desk',1,0],['ops',1,0],['agenda',1,1],['inbox',1,0],['mrs',1,0],['reports',0,1]]
const MODS=[['core','engine',1,[],'Dispatcher, runs, sessions, accounts, doctor',1],['core-api','engine',1,[],'crow-core: store, inbox, missions, /api',1],['nest','engine',1,['core-api'],'Nest web front',1],
 ['git','engine',1,[],'Hooks, git activity, worktrees, identity check'],['forge','engine',1,['git'],'Merge requests and reviews on GitLab or GitHub'],['mail','engine',1,[],'Calendar and mail counts, reply drafts'],
 ['vault','engine',1,[],'Obsidian vault reads, eod skill'],['team','engine',1,[],'Sprint, 1:1s, mail to answer'],['deck','engine',1,[],'crow-deck terminal front'],['afk','engine',1,[],'AFK and night runs'],
 ['releases','engine',1,[],'Changelog and releases view'],['retro','engine',1,[],'Session retros, digest, cost audit'],['design','engine',0,[],'Screenshot, crop and compare tools'],['office','engine',0,[],'Mail text, tracked-changes DOCX']]

const pv=(c)=>`<div class="pv" style="background:${c[0]}"><i style="background:${c[3]};border-bottom:2px solid ${c[1]}"></i><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px"><i style="background:${c[3]};border-top:2px solid ${c[1]}"></i><i style="background:${c[3]};border-top:2px solid ${c[2]}"></i><i style="background:${c[3]}"></i></div></div>`
const themeCards=(small)=>THEMES.map(t=>`<div class="th ${t[0]===NEW.theme?'on':''}" style="${small?'flex:1':'width:170px'}">${pv(t[2])}<div class="n"><span>${t[0]===NEW.theme?'◉':'○'} ${t[0]}</span><span class="c-s">${t[0]===CUR.theme?'current':t[1]}</span></div></div>`).join('')
const heroRows=()=>HEROES.map(h=>`<div class="row ${h[0]===NEW.hero?'sel':''}"><span class="${h[0]===NEW.hero?'c-m':'c-s'}">${h[0]===NEW.hero?'◉':'○'}</span><span class="t">${h[0]}</span><span class="s">${h[2]}</span></div>`).join('')
const pageRows=(o={})=>PAGES.map((p,i)=>`<div class="row ${p[2]?'chg':''} ${p[1]?'':'dim'}"><span class="hdl">⠿</span><span class="c-s" style="width:14px">${p[1]?PAGES.slice(0,i+1).filter(x=>x[1]).length:'·'}</span><span class="t">${p[0]}</span>${p[2]?`<span class="s c-n">${p[1]?'moved up':'hidden'}</span>`:''}${o.arrows?'<span class="btn">▲</span><span class="btn">▼</span>':''}<span class="sw ${p[1]?'on':''} ${p[0]==='home'?'lock':''}"></span></div>`).join('')
const modRow=(m,o={})=>`<div class="row"><span class="t">${m[0]}</span>${o.sum?`<span class="s" style="flex:1 1 200px">${m[4]}</span>`:''}${m[3].length?`<span class="chip" style="font-size:10.5px;padding:0 7px">needs ${m[3].join(', ')}</span>`:''}${m[5]?'<span class="s">required</span>':''}<span class="sw ${m[2]?'on':''} ${m[5]?'lock':''}"></span></div>`
const diff=`<div class="diff"><span class="c-s">crow.yaml · modules.nest</span><br><span class="m">- theme: modern</span><br><span class="p">+ theme: cyber</span><br><span class="m">- pages: [home, desk, ops, inbox, mrs, agenda, reports]</span><br><span class="p">+ pages: [home, desk, ops, agenda, inbox, mrs]</span></div>`
const diffLook=`<div class="diff"><span class="c-s">crow.yaml · modules.nest</span><br><span class="m">- theme: modern</span><br><span class="p">+ theme: cyber</span></div>`
const LOG=`$ crow nest build
vite v6 building for production...
✓ virtual:nest-modules  7 pages · 2 themes · 1 hero
✓ 412 modules transformed
dist/index.html   built in 38s`
const ERR=`$ crow nest build
✕ brick weather: page Forecast.tsx: name must match ^[a-z][a-z0-9-]*$
  build stopped · crow.yaml kept · Nest still on the last build`
const saveBar=(ph)=>`<div class="save"><span class="c-n">◆ 3 changes</span>${ph?'':'<span class="c-s">theme switches live · pages need a rebuild (~40 s)</span>'}<span style="margin-left:auto" class="btn">DISCARD</span><span class="btn p">SAVE + REBUILD</span></div>`
const building=`<div class="pn" style="border-color:#7dc4e4"><div class="ph"><span class="c-w">⟳ Rebuilding Nest</span><span class="c-s">step 3 / 4 · 24 s</span></div><div class="prog"><i style="width:68%"></i></div><div class="log">${LOG.split('\n').slice(0,4).join('\n')}</div><div class="c-s" style="font-size:11px">Nest reloads by itself when the build passes.</div></div>`
const failed=`<div class="pn" style="border-color:#ed8796"><div class="ph"><span class="c-f">✕ Build failed · brick weather</span><span class="btn">OPEN BRICK</span></div><div class="log">${ERR}</div></div>`

function A(){
 if(F==='laptop'){
  return lap(`<div class="hd1"><h1>SETTINGS</h1><span class="c-s">one page, sections stacked · core writes crow.yaml</span></div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px;flex:1;min-height:0">
   <div style="display:flex;flex-direction:column;gap:10px;min-height:0">
    <div class="pn"><div class="ph"><span>Theme</span><span class="c-n">changed</span></div><div style="display:flex;gap:8px">${themeCards(1)}</div><div class="c-s" style="font-size:11px">applies live as a preview · saved on SAVE</div></div>
    <div class="pn"><div class="ph"><span>Hero</span><span class="c-s">holotable</span></div>${heroRows()}</div>
    <div class="pn" style="flex:1"><div class="ph"><span>General</span><span class="c-s">later</span></div><div class="c-s" style="font-size:11.5px">Room for other settings as they come (language, time zone, refresh rate).</div></div>
   </div>
   <div class="pn"><div class="ph"><span>Pages</span><span class="c-s">drag to order · switch to show</span></div>${pageRows()}<div class="c-s" style="font-size:11px">Home stays on. Brick pages show here once their brick is on.</div></div>
   <div class="pn"><div class="ph"><span>Modules</span><span class="c-s">crow modules · 12 / 14 on</span></div>${MODS.map(m=>modRow(m,{sum:1})).join('')}</div>
  </div>${saveBar()}`,
  note(700,250,'Changed rows get a yellow edge. One save bar for the whole page.')+note(1130,560,'Module switches: second slice. Locked rows are required by Nest itself.'),'A · ONE PAGE, THREE COLUMNS + SAVE BAR')}
 return phone(`<div class="hd1"><h1>SETTINGS</h1></div>
  <div class="pn"><div class="ph"><span>Theme</span><span class="c-n">changed</span></div><div style="display:flex;gap:8px">${themeCards(1)}</div></div>
  <div class="pn"><div class="ph"><span>Hero</span></div>${heroRows()}</div>
  <div class="pn"><div class="ph"><span>Pages</span><span class="c-s">drag ⠿</span></div>${pageRows()}</div>
  <div class="pn"><div class="ph"><span>Modules</span><span class="c-s">12 / 14 on ›</span></div>${MODS.slice(3,6).map(m=>modRow(m)).join('')}<div class="c-s" style="font-size:11px">+ 11 more</div></div>
  ${saveBar(1)}`,'A · One scroll page','Sections stacked in one scroll. The save bar sticks above the nav when something changed.')
}

function B(){
 const rail=(on)=>`<div class="pn" style="width:220px;flex:0 0 auto;gap:4px">${[['Look','theme, hero'],['Pages','order, show'],['Modules','bricks on / off'],['General','later']].map(s=>`<div class="row ${s[0]===on?'sel':''}" style="flex-direction:column;align-items:flex-start;gap:0"><span>${s[0]}</span><span class="s">${s[1]}</span></div>`).join('')}<div style="flex:1"></div><div class="c-s" style="font-size:11px">last build 09:12 · 38 s</div></div>`
 if(F==='laptop'){
  return lap(`<div class="hd1"><h1>SETTINGS</h1><span class="c-s">pick a section on the left</span></div>
  <div style="display:flex;gap:10px;flex:1;min-height:0">${rail('Look')}
   <div class="pn" style="flex:1"><div class="ph"><span>Look</span><span class="c-n">2 changes</span></div>
    <div class="g"><span>Theme</span><span class="c-s">engine + brick themes</span></div><div style="display:flex;gap:10px">${themeCards()}</div>
    <div class="g"><span>Hero</span><span class="c-s">one per brick that ships one</span></div>${heroRows()}
    <div class="g"><span>Page order</span><span class="c-s">on the Pages section</span></div><div class="row"><span class="t">home · desk · ops · agenda · inbox · mrs</span><span class="s c-n">reports hidden</span><span class="btn">EDIT ›</span></div>
    <div style="flex:1"></div>${diff}
    <div style="display:flex;gap:8px;justify-content:flex-end"><span class="btn">DISCARD</span><span class="btn p">SAVE + REBUILD</span></div></div>
   <div style="width:400px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px">
    <div class="pn"><div class="ph"><span>Preview · cyber</span><span class="c-s">live, not saved</span></div><div style="height:220px;border-radius:8px;background:#0b0f14;padding:10px;display:grid;grid-template-rows:20px 1fr;gap:8px"><div style="border-bottom:2px solid #39ff88;color:#39ff88;font:11px Michroma,sans-serif">CR-0W</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="background:#121a22;border:1px solid #39ff8855;border-radius:6px"></div><div style="background:#121a22;border:1px solid #ff3fa455;border-radius:6px"></div></div></div></div>
    ${building}</div></div>`,
  note(560,330,'Section rail on the left. Each section saves on its own and shows the crow.yaml diff first.')+note(1040,560,'Build state stays on screen after save. Nest reloads when it passes.'),'B · SECTION RAIL + DIFF + PREVIEW')}
 return phone(`<div class="hd1"><h1>SETTINGS › LOOK</h1><span class="c-s" style="margin-left:auto">‹ back</span></div>
  <div class="pn"><div class="ph"><span>Theme</span><span class="c-n">changed</span></div><div style="display:flex;gap:8px">${themeCards(1)}</div></div>
  <div class="pn"><div class="ph"><span>Hero</span></div>${heroRows()}</div>
  ${diffLook}
  <div style="display:flex;gap:8px;justify-content:flex-end"><span class="btn">DISCARD</span><span class="btn p">SAVE + REBUILD</span></div>${building}`,'B · Section list, drill in','Settings opens on a list (Look, Pages, Modules, General). Each section shows its diff and saves on its own.')
}

function C(){
 if(F==='laptop'){
  return lap(`<div class="hd1"><h1>SETTINGS</h1><span class="tab on">NEST</span><span class="tab">MODULES 12/14</span><span class="tab">GENERAL</span><span class="c-s" style="margin-left:auto">changes queue on the right · one rebuild for all</span></div>
  <div style="display:flex;gap:10px;flex:1;min-height:0">
   <div style="flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:10px;min-height:0">
    <div class="pn"><div class="ph"><span>Theme</span><span class="c-n">modern → cyber</span></div><div style="display:flex;gap:10px">${themeCards(1)}</div></div>
    <div class="pn"><div class="ph"><span>Hero</span><span class="c-s">holotable</span></div>${heroRows()}<div class="c-s" style="font-size:11px">A brick that ships nest/hero/ adds a row here.</div></div>
    <div class="pn" style="grid-column:1/-1"><div class="ph"><span>Pages</span><span class="c-s">top bar order, left to right</span></div>
     <div style="display:flex;gap:6px;flex-wrap:wrap">${PAGES.map((p,i)=>`<div class="tile" style="border:1px solid ${p[2]?'#eed49f':'#494d64'};border-radius:9px;padding:8px 10px;width:150px;display:flex;flex-direction:column;gap:6px;${p[1]?'':'opacity:.5'}"><div style="display:flex;justify-content:space-between"><span class="hdl">⠿</span><span class="sw ${p[1]?'on':''} ${p[0]==='home'?'lock':''}"></span></div><span style="font:13px Michroma,sans-serif;letter-spacing:.05em">${p[0].toUpperCase()}</span><span class="c-s" style="font-size:11px">${p[1]?'#'+PAGES.slice(0,i+1).filter(x=>x[1]).length:'hidden'}${p[2]&&p[1]?' · moved':''}</span></div>`).join('')}</div>
     <div class="c-s" style="font-size:11px">Drag tiles to reorder. Brick pages (from on bricks) join the row.</div></div>
   </div>
   <div style="width:400px;flex:0 0 auto;display:flex;flex-direction:column;gap:10px">
    <div class="pn"><div class="ph"><span>Pending</span><span class="c-n">3</span></div>
     <div class="row chg"><span class="t">theme: modern → cyber</span><span class="s">live</span><span class="btn">UNDO</span></div>
     <div class="row chg"><span class="t">agenda moved to #4</span><span class="s">rebuild</span><span class="btn">UNDO</span></div>
     <div class="row chg"><span class="t">reports hidden</span><span class="s">rebuild</span><span class="btn">UNDO</span></div>
     ${diff}<div style="display:flex;gap:8px;justify-content:flex-end"><span class="btn">DISCARD ALL</span><span class="btn p">SAVE + REBUILD</span></div></div>
    ${failed}</div></div>`,
  note(300,610,'Pages as tiles in top bar order. Tabs split Nest, Modules and General.')+note(1040,640,'Failed build: names the brick, keeps crow.yaml, Nest stays on the last build.'),'C · TILES + PENDING QUEUE')}
 return phone(`<div class="hd1"><h1>SETTINGS</h1></div><div style="display:flex;gap:4px"><span class="tab on">NEST</span><span class="tab">MODULES</span><span class="tab">GENERAL</span></div>
  <div class="pn"><div class="ph"><span>Theme</span><span class="c-n">→ cyber</span></div><div style="display:flex;gap:8px">${themeCards(1)}</div></div>
  <div class="pn"><div class="ph"><span>Pages</span><span class="c-s">drag ⠿</span></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px">${PAGES.map(p=>`<div style="border:1px solid ${p[2]?'#eed49f':'#494d64'};border-radius:8px;padding:6px;font-size:11px;display:flex;justify-content:space-between;align-items:center;${p[1]?'':'opacity:.5'}">${p[0]}<span class="sw ${p[1]?'on':''}" style="transform:scale(.8)"></span></div>`).join('')}</div></div>
  <div class="pn"><div class="ph"><span>Pending</span><span class="c-n">3</span></div><div class="row chg"><span class="t">theme → cyber</span><span class="btn">UNDO</span></div><div class="row chg"><span class="t">agenda → #4</span><span class="btn">UNDO</span></div><div class="row chg"><span class="t">reports hidden</span><span class="btn">UNDO</span></div><div style="display:flex;gap:8px;justify-content:flex-end"><span class="btn p">SAVE + REBUILD</span></div></div>
  ${failed}`,'C · Tabs + pending queue','Tabs for Nest, Modules, General. Page tiles in a 3-wide grid. Pending list with undo per change, then one rebuild.')
}
document.getElementById('root').innerHTML=V==='B'?B():V==='C'?C():A()
</script>
