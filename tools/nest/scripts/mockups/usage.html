<!doctype html><meta charset="utf-8"><title>Nest Usage sketches</title>
<!-- Usage page (item_227). ?v=A|B|C&f=laptop|phone
     Data shaped on /api/state/usage and crow-cost-audit --json (7 days), anonymized.
     Options differ on: one account first, all accounts first, or an account list with one chart at a time.
     Chat is folded to a button. Yellow dashed tags mark data the core lacks today. -->
<style>
*{box-sizing:border-box}
:root{--bg:#24273a;--fg:#cad3f5;--dim:#a5adcb;--sub:#939ab7;--panel:rgba(30,32,48,.78);--line:#494d64;--row:rgba(54,58,79,.55);--btn:rgba(54,58,79,.7);--well:rgba(24,25,38,.6);
 --acc:#c6a0f6;--ink:#181926;--w:#7dc4e4;--n:#eed49f;--f:#ed8796;--d:#a6da95;--b:#8aadf4;--s:#8087a2;--t:#8bd5ca;
 --dots:radial-gradient(color-mix(in srgb,#494d64 45%,transparent) 1px,transparent 1.2px) 0 0/18px 18px}
html,body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.45 'Fira Code',ui-monospace,monospace}
.lap{width:1440px;height:900px;display:flex;flex-direction:column;background:var(--dots),var(--bg);overflow:hidden;position:relative}
.hdr{height:54px;flex:0 0 auto;display:flex;align-items:center;gap:18px;padding:0 20px;background:rgba(24,25,38,.85);border-bottom:1px solid var(--line);letter-spacing:.08em;font-size:12.5px}
.logo{font:18px Michroma,sans-serif;color:var(--acc);letter-spacing:.12em}
.pill{border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:3px 12px;font-size:11px}
.nv{color:var(--fg)}.nv.on{background:var(--acc);color:var(--ink);padding:5px 10px;border-radius:7px}.nv b{color:var(--n);font-weight:400}
.gauge{display:inline-flex;align-items:center;gap:6px;font-size:11px}.gauge i{display:inline-block;width:56px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--d) var(--p),#363a4f var(--p))}
.cc{border:1px solid var(--n);color:var(--n);border-radius:999px;padding:1px 9px;font-size:11px}.cc.w{border-color:var(--w);color:var(--w)}
.page{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px 20px 16px}
.bar{display:flex;align-items:center;gap:10px;letter-spacing:.08em}
.bar h1{font:20px Michroma,sans-serif;margin:0 10px 0 0;letter-spacing:.1em;font-weight:400}
.seg{display:flex;gap:4px}.seg span{border:1px solid var(--line);border-radius:7px;padding:4px 11px;font-size:11.5px;background:var(--btn)}.seg .on{background:var(--acc);border-color:var(--acc);color:var(--ink)}
.sum{margin-left:auto;color:var(--dim);font-size:12.5px;letter-spacing:.06em}.sum .x{color:var(--n)}
/* panes with a title set in the top border, as in the deck */
.pn{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:16px 12px 10px;min-height:0;min-width:0;display:flex;flex-direction:column;gap:5px}
.pn>.tt{position:absolute;top:-9px;left:12px;background:var(--bg);padding:0 7px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:8px}
.pn>.tr{position:absolute;top:-9px;right:12px;background:var(--bg);padding:0 7px;font-size:11px;color:var(--sub);letter-spacing:.06em}
.pn.sel{border-color:var(--acc)}
.r{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 9px;border-radius:7px;font-size:12.5px;min-width:0}
.r:nth-child(odd){background:var(--row)}.r .ref{color:var(--t)}.r.mine .ref{color:var(--acc)}.r.done{opacity:.55}.r.done .ref{color:var(--d)}
.r .ti{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.r .ti small{display:block;color:var(--sub);font-size:11px}
.r.on{background:rgba(198,160,246,.14);box-shadow:inset 2px 0 0 var(--acc)}
.st{display:flex;gap:10px;align-items:center;font-size:11.5px;color:var(--dim);white-space:nowrap}
.ok{color:var(--d)}.ko{color:var(--f)}.ru{color:var(--w)}.wa{color:var(--n)}.mu{color:var(--sub)}.ac{color:var(--acc)}.cy{color:var(--t)}
.btn{display:inline-block;border:1px solid var(--line);background:var(--btn);border-radius:8px;padding:4px 11px;font-size:11.5px;letter-spacing:.06em;white-space:nowrap}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--ink)}.btn.g{background:none}
.k{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:10.5px;color:var(--dim);margin-right:3px}
/* detail */
.dh{font:17px Michroma,sans-serif;letter-spacing:.04em;line-height:1.35}.dh .ref{color:var(--acc)}
.meta{color:var(--dim);font-size:12px}
.facts{display:flex;gap:26px;padding:10px 12px;border-radius:9px;background:var(--well)}
.facts div{display:flex;flex-direction:column;gap:2px;font-size:13px}.facts small{color:var(--sub);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.sh{font-size:11px;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;margin-top:6px;display:flex;justify-content:space-between}
.stg{display:flex;align-items:center;gap:0;font-size:12px}.stg span{padding:4px 10px;border:1px solid var(--line);margin-right:-1px}
.stg span:first-child{border-radius:7px 0 0 7px}.stg span:last-child{border-radius:0 7px 7px 0}.stg .ok{border-color:var(--d)}.stg .ko{border-color:var(--f);background:rgba(237,135,150,.12)}.stg .mu{border-style:dashed}
.th{border-left:2px solid var(--n);padding:6px 12px;background:var(--well);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.th .w{color:var(--sub);font-size:11px}.th.res{border-left-color:var(--line);color:var(--sub)}
.log{font-size:11.5px;background:var(--well);border-radius:8px;padding:8px 12px;color:var(--dim);white-space:pre;line-height:1.5}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.patc{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:11.5px;color:var(--dim)}
.patc b{color:var(--n);font-weight:400}
.pop{border:1px solid var(--acc);border-radius:10px;background:#1e2030;padding:10px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 8px 24px #000a}
.pop .pr{display:grid;grid-template-columns:1fr 70px 50px;gap:10px;font-size:12px;padding:3px 0;border-top:1px solid #363a4f}
.pop .pr.hit{color:var(--n)}
.lbl{position:absolute;left:20px;bottom:12px;z-index:9;background:var(--n);color:var(--ink);font:11.5px Michroma,sans-serif;padding:4px 10px;border-radius:6px;letter-spacing:.08em}
.keys{display:flex;gap:16px;font-size:11px;color:var(--sub);padding:4px 2px 0}
/* phone */
.duo{display:flex;gap:24px;padding:12px;align-items:flex-start;background:#181926;width:max-content}
.pw{width:368px}.pl{font:12px Michroma,sans-serif;color:var(--acc);padding:2px 2px 6px;letter-spacing:.06em}
.ph{width:368px;height:800px;border:1px solid var(--line);border-radius:24px;background:var(--dots),var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
.ph .top{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}.ph .top .logo{font-size:13px}
.ph .bd{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:6px 12px;overflow:hidden}
.ph .bar h1{font-size:15px}.ph .pn{padding:14px 8px 8px}.ph .r{grid-template-columns:40px 1fr auto;padding:7px 7px;font-size:12px;gap:8px}
.ph .nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:11px 0 14px;font-size:11.5px;color:var(--sub);background:rgba(24,25,38,.85)}.ph .nav .on{color:var(--acc)}
.cap{font-size:11.5px;color:var(--n);padding:8px 2px 0;line-height:1.45;width:368px}
.sheet{position:absolute;left:0;right:0;bottom:0;top:96px;border-top:1px solid var(--acc);border-radius:18px 18px 0 0;background:#1e2030;padding:10px 14px;display:flex;flex-direction:column;gap:9px;box-shadow:0 -10px 30px #000c}
.grab{width:42px;height:4px;border-radius:2px;background:#5b6078;margin:0 auto 2px}
.ph .dh{font-size:14px}.ph .facts{gap:14px;padding:8px 10px}.ph .facts div{font-size:12px}
.ph .stg{font-size:11px}.ph .stg span{padding:3px 7px}
.dim{opacity:.35;pointer-events:none}
</style>
<style>
.lbl{top:68px;bottom:auto;left:600px}
.fold{position:absolute;right:20px;bottom:12px;z-index:9;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:4px 12px;font-size:11.5px;background:rgba(24,25,38,.9);letter-spacing:.08em}
.gap{border:1px dashed var(--n);color:var(--n);border-radius:6px;padding:1px 7px;font-size:10.5px;white-space:nowrap}
:root{--c1:#5d8be6;--c2:#d57440;--c3:#2fa595;--c4:#9b6fdc}
svg text{font:10.5px 'Fira Code',monospace;fill:var(--sub)}
svg .vl{fill:var(--fg)}
.ch{display:flex;flex-direction:column;gap:4px;min-width:0}
.ch .cht{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;color:var(--acc);text-transform:uppercase}
.leg{display:flex;gap:14px;font-size:11px;color:var(--dim);flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.leg .ln2{width:16px;height:0;border-top:2px dashed var(--dim);border-radius:0}
.tile{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:9px;background:var(--well);min-width:0}
.tile small{color:var(--sub);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}.tile b{font:18px Michroma,sans-serif;font-weight:400}
.tile span{font-size:11px;color:var(--dim)}
.tbl{display:grid;gap:5px 12px;font-size:12px}.tbl .h{color:var(--sub);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}.tbl .rt{text-align:right}
.acr{display:grid;grid-template-columns:120px 1fr 1fr 150px;gap:18px;align-items:center;padding:10px 12px;border-radius:9px;background:var(--row);font-size:12px}
.acr.on{box-shadow:inset 2px 0 0 var(--acc);background:rgba(198,160,246,.12)}
.al{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-radius:8px;font-size:12px;align-items:center}
.al:nth-child(odd){background:var(--row)}.al.on{box-shadow:inset 2px 0 0 var(--acc);background:rgba(198,160,246,.12)}
</style><body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),V=(Q.get('v')||'A').toUpperCase(),F=Q.get('f')||'laptop'
const gap=t=>`<span class="gap">gap: ${t}</span>`
const lbl=t=>`<div class="lbl">${t}</div>`
// data: usage.limits + crow-cost-audit --json --days 7, anonymized
const ACC=[{a:'acct1',h5:70,wk:57,burn:14,end5:'17:40',reset5:'18:00',resetW:'Fri 09:00',plan:'max'},
 {a:'acct2',h5:36,wk:95,burn:6,end5:'—',reset5:'18:00',resetW:'Thu 18:00',plan:'max'},
 {a:'acct3',h5:2,wk:21,burn:0,end5:'—',reset5:'—',resetW:'Mon 10:00',plan:'pro'}]
const FLOOR=85 // used % at which the req_064 floor stops dispatch
const DAYS=[['Wed',38,6],['Thu',52,9],['Fri',41,4],['Sat',12,2],['Sun',8,1],['Mon',61,11],['Tue',73,13],['Wed',34,5]] // $ opus, $ sonnet
const PROJ=[['cr-0w',210],['api',72],['shell',41],['butler',26]]
const KIND=[['interactive',231],['headless',86],['skills (/retro, /weekly…)',32]]
const MODEL=[['opus',318,'var(--c1)'],['sonnet',31,'var(--c2)']]
const RUNS=[['Nest Agenda build','cr-0w','headless','2.9M','$18.40'],['hub session 25/11','cr-0w','interactive','2.1M','$14.10'],['Review !242','api','headless','1.4M','$8.70'],['Nest MRs build','cr-0w','headless','1.2M','$7.90'],['retro batch','cr-0w','skill','0.6M','$3.20']]
// window chart: % used over the 5h window, x axis Paris time, y axis % used
function win(w,h,used,{x0='13:00',x1='18:00',ticks=['13:00','14:00','15:00','16:00','17:00','18:00'],now=.47,proj=null,label='5h window'}={}){
 const L=40,R=14,T=20,B=24,iw=w-L-R,ih=h-T-B,X=f=>L+f*iw,Y=p=>T+ih*(1-p/100)
 const pts=[[0,0],[.08,6],[.18,14],[.27,25],[.33,38],[.4,52],[now,used]]
 const path=pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join('')
 let s=`<svg width="${w}" height="${h}">`
 for(const p of [0,25,50,75,100]) s+=`<line x1="${L}" x2="${w-R}" y1="${Y(p)}" y2="${Y(p)}" stroke="#363a4f"/><text x="${L-6}" y="${Y(p)+3.5}" text-anchor="end">${p}%</text>`
 ticks.forEach((t,i)=>s+=`<text x="${X(i/(ticks.length-1))}" y="${h-8}" text-anchor="${i===ticks.length-1?'end':i?'middle':'start'}">${t}</text>`)
 s+=`<line x1="${L}" x2="${w-R}" y1="${Y(FLOOR)}" y2="${Y(FLOOR)}" stroke="var(--f)" stroke-dasharray="2 3"/><text x="${L+6}" y="${Y(FLOOR)-4}" style="fill:var(--f)">floor ${100-FLOOR}% left</text>`
 s+=`<path d="${path}L${X(now)},${Y(0)}L${X(0)},${Y(0)}Z" fill="var(--c1)" opacity=".18"/><path d="${path}" fill="none" stroke="var(--c1)" stroke-width="2"/>`
 if(proj!=null) s+=`<line x1="${X(now)}" y1="${Y(used)}" x2="${X(1)}" y2="${Y(proj)}" stroke="var(--dim)" stroke-width="2" stroke-dasharray="5 4"/><text x="${X(1)}" y="${Y(proj)-7}" text-anchor="end" class="vl">→ ${proj}% at reset</text>`
 s+=`<line x1="${X(now)}" x2="${X(now)}" y1="${T}" y2="${T+ih}" stroke="var(--acc)"/><circle cx="${X(now)}" cy="${Y(used)}" r="4" fill="var(--c1)" stroke="var(--bg)" stroke-width="2"/><text x="${X(now)-8}" y="${Y(used)-8}" text-anchor="end" class="vl">${used}% · now 15:20</text>`
 return s+`<text x="${L}" y="${T-8}" style="font-size:9.5px">% used</text></svg>`}
// stacked daily cost, x day, y $
function days(w,h){const L=40,R=8,T=12,B=24,iw=w-L-R,ih=h-T-B,mx=100,bw=iw/DAYS.length,Y=v=>T+ih*(1-v/mx)
 let s=`<svg width="${w}" height="${h}">`
 for(const v of [0,25,50,75,100]) s+=`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#363a4f"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">$${v}</text>`
 DAYS.forEach(([d,o,so],i)=>{const x=L+i*bw+bw*.2,bwi=bw*.6
  s+=`<rect x="${x}" y="${Y(o)}" width="${bwi}" height="${Y(0)-Y(o)}" fill="var(--c1)" rx="1"/><rect x="${x}" y="${Y(o+so)}" width="${bwi}" height="${Y(o)-Y(o+so)-2}" fill="var(--c2)" rx="3"/>`
  s+=`<text x="${x+bwi/2}" y="${h-8}" text-anchor="middle" ${i===DAYS.length-1?'class="vl"':''}>${i===DAYS.length-1?'today':d}</text>`
  if(i===6) s+=`<text x="${x+bwi/2}" y="${Y(o+so)-5}" text-anchor="middle" class="vl">$${o+so}</text>`})
 return s+`<text x="${L}" y="${T-3}" style="font-size:9.5px">cost / day</text></svg>`}
// horizontal bars with direct value labels
function hb(rows,w,{c='var(--c1)',unit='$'}={}){const mx=Math.max(...rows.map(r=>r[1]))
 return `<div style="display:flex;flex-direction:column;gap:6px">${rows.map(r=>`<div style="display:grid;grid-template-columns:${w}px 1fr 60px;gap:8px;align-items:center;font-size:12px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r[0]}</span><span style="height:12px;background:#363a4f55;border-radius:0 4px 4px 0"><i style="display:block;height:100%;width:${r[1]/mx*100}%;background:${r[2]||c};border-radius:0 4px 4px 0"></i></span><span class="rt" style="text-align:right">${unit}${r[1]}</span></div>`).join('')}</div>`}
const chart=(t,body,right='')=>`<div class="ch"><div class="cht"><span>${t}</span>${right}</div>${body}</div>`
const legM=`<div class="leg"><span><i style="background:var(--c1)"></i>opus</span><span><i style="background:var(--c2)"></i>sonnet</span></div>`
const legW=`<div class="leg"><span><i style="background:var(--c1)"></i>used</span><span><i class="ln2"></i>projected</span><span style="color:var(--f)">┄ floor</span><span class="mu">x: Paris time · y: % of the window used</span></div>`
const tiles=`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div class="tile"><small>7 days</small><b>$349</b><span>7 423 turns</span></div><div class="tile"><small>cache hit</small><b>94%</b><span>of context read</span></div><div class="tile"><small>hub start ctx</small><b>47k</b><span>median · 33 sessions</span></div><div class="tile"><small>largest bucket</small><b>&lt;50k</b><span>opus · 61% of turns</span></div></div>`
const topRuns=`<div class="tbl" style="grid-template-columns:1fr 70px 90px 60px 60px"><span class="h">top runs</span><span class="h">project</span><span class="h">kind</span><span class="h rt">ctx</span><span class="h rt">cost</span>${RUNS.map(r=>`<span>${r[0]}</span><span class="mu">${r[1]}</span><span class="mu">${r[2]}</span><span class="rt">${r[3]}</span><span class="rt">${r[4]}</span>`).join('')}</div>`
const hdr=`<div class="hdr"><span class="logo">CR-0W</span><span class="pill">◈ ALL</span>${['HOME','DESK','OPS','INBOX','MRS','AGENDA','REPORTS'].map((n,i)=>`<span class="nv">${i+1} ${n}</span>`).join('')}<span style="margin-left:auto" class="gauge" style="color:var(--acc)">ACCT1 <i style="--p:30%"></i> 30%</span><span class="gauge">ACCT2 <i style="--p:64%"></i> 64%</span><span>15:20</span></div>`
const page=(body,seg)=>`<div class="lap">${hdr}<div class="page"><div class="bar"><h1>USAGE</h1>${seg}<span class="sum">week <span class="x">$349</span> · 3 accounts · 5h resets 18:00</span></div>${body}</div><div class="fold">◇ BUTLER</div></div>`
const accSeg=s=>`<div class="seg">${ACC.map(a=>`<span class="${a.a===s?'on':''}">${a.a.toUpperCase()}</span>`).join('')}</div>`
const facts=a=>`<div class="facts"><div><small>5h left</small><span>${100-a.h5}%</span></div><div><small>burn</small><span>${a.burn}%/h</span></div><div><small>empty at</small><span class="wa">${a.end5}</span></div><div><small>resets</small><span>${a.reset5}</span></div><div><small>week left</small><span>${100-a.wk}%</span></div><div><small>week resets</small><span>${a.resetW}</span></div></div>`
const pane=(t,body,st='',tr='')=>`<div class="pn" style="${st}"><span class="tt">${t}</span>${tr?`<span class="tr">${tr}</span>`:''}${body}</div>`

function A(){const a=ACC[0]
 return page(`<div style="display:grid;grid-template-columns:1.25fr 1fr;gap:16px">${pane('ACCT1 · 5H WINDOW',facts(a)+win(720,200,a.h5,{proj:98})+legW,'',gap('quota history (item_297)'))}${pane('ACCT1 · WEEK',win(540,200,a.wk,{ticks:['Fri','Sat','Sun','Mon','Tue','Wed','Thu','Fri'],now:.7,proj:79})+`<div class="leg"><span class="mu">x: day · y: % of the week used · floor applies to the week too</span></div>`)}</div>
 <div style="display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;flex:1;min-height:0">${pane('COST PER DAY · 7 DAYS',days(470,210)+legM,'',gap('per-day series'))}${pane('WHERE IT WENT',chart('per project',hb(PROJ,80))+chart('per run kind',hb(KIND,150,{c:'var(--c3)'})),'',gap('split per account'))}${pane('RUNS',tiles.replace('repeat(4,1fr)','repeat(2,1fr)')+topRuns)}</div>`,accSeg('acct1'))}

function B(){
 const bullet=(u,pr,t)=>`<div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;justify-content:space-between;font-size:11px"><span class="mu">${t}</span><span>${100-u}% left${pr?` · <span class="mu">→ ${pr}% used at reset</span>`:''}</span></div><div style="position:relative;height:12px;background:#363a4f;border-radius:0 4px 4px 0"><i style="position:absolute;left:0;top:0;bottom:0;width:${u}%;background:var(--c1);border-radius:0 4px 4px 0"></i>${pr?`<i style="position:absolute;left:${u}%;top:3px;bottom:3px;width:${pr-u}%;border-top:2px dashed var(--dim)"></i>`:''}<i style="position:absolute;left:${FLOOR}%;top:-3px;bottom:-3px;width:2px;background:var(--f)"></i></div></div>`
 const rows=ACC.map((a,i)=>`<div class="acr ${i===0?'on':''}"><span><b style="font:14px Michroma,sans-serif;font-weight:400">${a.a.toUpperCase()}</b><br><span class="mu" style="font-size:11px">${a.plan} · burn ${a.burn}%/h</span></span>${bullet(a.h5,i===0?98:i===1?44:0,'5h · resets '+a.reset5)}${bullet(a.wk,i===0?79:0,'week · resets '+a.resetW)}<span style="font-size:11.5px">${a.burn?`empty at <span class="wa">${a.end5}</span>`:'<span class="mu">idle</span>'}<br><span class="mu">${i===1?'week under floor · no dispatch':''}</span></span></div>`).join('')
 return page(pane('ACCOUNTS',rows+`<div class="leg"><span><i style="background:var(--c1)"></i>used</span><span><i class="ln2"></i>projected to reset</span><span style="color:var(--f)">▏ floor (dispatch stops)</span><span class="mu">click a row → /usage/&lt;account&gt;</span></div>`,'gap:8px')+
 `<div style="display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:16px;flex:1;min-height:0">${pane('COST PER DAY',days(470,230)+legM,'',gap('per-day series'))}${pane('WHERE IT WENT',chart('per project',hb(PROJ,80))+chart('per model',hb(MODEL,80))+chart('per run kind',hb(KIND,150,{c:'var(--c3)'})))}${pane('RUNS',tiles.replace('repeat(4,1fr)','repeat(2,1fr)')+topRuns)}</div>`,`<div class="seg"><span class="on">ALL</span>${ACC.map(a=>`<span>${a.a.toUpperCase()}</span>`).join('')}</div><div class="seg"><span>TODAY</span><span class="on">7 DAYS</span><span>30 DAYS</span></div>`)}

function C(){const a=ACC[0]
 const spark=(u)=>`<svg width="90" height="22"><polyline points="0,21 15,19 30,16 45,12 60,8 70,${22-u*.21}" fill="none" stroke="var(--c1)" stroke-width="2"/><line x1="0" x2="90" y1="${22-FLOOR*.21}" y2="${22-FLOOR*.21}" stroke="var(--f)" stroke-dasharray="2 3"/></svg>`
 const list=ACC.map((x,i)=>`<div class="al ${i===0?'on':''}"><span><b style="font:13px Michroma,sans-serif;font-weight:400">${x.a.toUpperCase()}</b><br><span class="mu" style="font-size:11px">5h ${100-x.h5}% left · wk ${100-x.wk}%</span></span>${spark(x.h5)}</div>`).join('')
 return page(`<div style="display:grid;grid-template-columns:280px 1fr;gap:16px;flex:1;min-height:0">${pane('ACCOUNTS',list+`<div style="flex:1"></div>`+tiles.replace('repeat(4,1fr)','1fr'),'gap:6px')}
 <div style="display:flex;flex-direction:column;gap:16px;min-height:0">${pane('ACCT1 · 5H WINDOW',facts(a)+`<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">${win(530,190,a.h5,{proj:98})}${win(530,190,a.wk,{ticks:['Fri','Sat','Sun','Mon','Tue','Wed','Thu','Fri'],now:.7,proj:79})}</div>`+legW,'',gap('quota history (item_297)'))}
 ${pane('ANALYSIS',`<div style="display:flex;gap:8px;align-items:center"><div class="seg"><span class="on">PER DAY</span><span>PER PROJECT</span><span>PER MODEL</span><span>PER KIND</span><span>TOP RUNS</span></div><span class="mu" style="font-size:11px">one chart at a time</span></div><div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px">${days(620,220)}<div style="display:flex;flex-direction:column;gap:10px">${legM}${chart('this week',hb(PROJ,80))}</div></div>`,'flex:1',gap('per-day series'))}</div></div>`,accSeg('acct1'))}

// phone: account picker, window chart, analysis tabs, same for all options
const pTop=`<div class="top"><span class="logo">CR-0W</span><span class="mu" style="font-size:11px">15:20</span></div>`
const pNav=`<div class="nav"><span>Home</span><span>Desk</span><span>Ops</span><span>Inbox</span><span class="on">Usage</span></div>`
const phone=(lb,body,cap)=>`<div class="pw"><div class="pl">${lb}</div><div class="ph">${pTop}<div class="bd">${body}</div>${pNav}<div class="fold" style="bottom:58px;right:12px">◇</div></div><div class="cap">${cap}</div></div>`
function phones(){const a=ACC[0]
 const one=phone('account',`<div class="bar"><h1>USAGE</h1></div><div class="seg">${ACC.map((x,i)=>`<span class="${i?'':'on'}">${x.a.toUpperCase()}</span>`).join('')}</div>${pane('5H WINDOW',`<div class="facts" style="gap:12px;padding:7px 9px"><div><small>left</small><span>30%</span></div><div><small>burn</small><span>14%/h</span></div><div><small>empty</small><span class="wa">17:40</span></div></div>`+win(330,170,a.h5,{proj:98,ticks:['13h','14h','15h','16h','17h','18h']})+`<div class="leg" style="font-size:10.5px"><span><i style="background:var(--c1)"></i>used</span><span><i class="ln2"></i>projected</span><span style="color:var(--f)">┄ floor</span></div>`)}${pane('WEEK',win(330,130,a.wk,{ticks:['F','S','S','M','T','W','T','F'],now:.7,proj:79}))}`,'Account picker on top, the 5h and week charts stacked.')
 const two=phone('analysis',`<div class="bar"><h1>USAGE</h1><span class="sum" style="font-size:11px">7 days $349</span></div><div class="seg"><span class="on">DAY</span><span>PROJECT</span><span>MODEL</span><span>RUNS</span></div>${pane('COST PER DAY',days(330,200)+legM)}${pane('PER PROJECT',hb(PROJ,60))}`,'Analysis one chart per tab, scroll for the rest.')
 return one+two}
const VIEWS={A:[A,'A · ONE ACCOUNT AT A TIME · ANALYSIS GRID'],B:[B,'B · ALL ACCOUNTS FIRST · ANALYSIS GRID'],C:[C,'C · ACCOUNT LIST + ONE CHART AT A TIME']}
document.getElementById('root').innerHTML=F==='phone'?`<div class="duo">${phones()}</div>`:VIEWS[V][0]().replace(/<\/div>$/,lbl(VIEWS[V][1])+'</div>')
</script>
