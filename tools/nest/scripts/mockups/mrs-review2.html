<!doctype html><meta charset="utf-8"><title>Nest MR review round 2</title>
<!-- Review screen of an MR (item_300, round 2). ?v=A|B|C&f=laptop|phone
     Brief (owner 2026-11-26): web UX with buttons, no keybinds. 1. a summary of the MR. 2. each finding inline in the code
     with its explanation and Accept / Refuse / Edit / Chat. The owner adds inline comments on any line, keeps them as his own
     or sends them to crow to check. One Post button with the exact batch. Data: crow-review-run findings, generic names. -->
<style>

.lap{font-size:13px}

.btn2.p{background:var(--acc);border-color:var(--acc);color:var(--ink);font-weight:600}.btn2.g{background:transparent}.btn2.ok2{border-color:var(--d);color:var(--d)}.btn2.no{border-color:var(--line);color:var(--sub)}

.file{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--well)}

<body><div id="root"></div>
<script>
const Q=new URLSearchParams(location.search),V=(Q.get('v')||'A').toUpperCase(),F=Q.get('f')||'laptop'
const NAV=['HOME','DESK','OPS','INBOX','MRS','AGENDA','REPORTS']
const hdr=()=>`<div class="hdr"><span class="logo">CR-0W</span><span class="pill">◈ ALL</span>${NAV.map((n,i)=>`<span class="nv ${n==='MRS'?'on':''}">${i+1} ${n}</span>`).join('')}<span style="margin-left:auto" class="gauge">MAIN <i style="--p:72%"></i> 72%</span><span class="gauge">WORK <i style="--p:41%"></i> 41%</span><span>10:40</span><span>◐</span><span>⚙</span></div>`
const lbl=t=>`<div class="lbl">${t}</div>`
const COL={acc:'var(--d)',ref:'var(--sub)',todo:'var(--n)',cur:'var(--acc)',you:'var(--w)'}
const FD=[
 ['F1','q','events out of order: recovery before failure','alert_ops.py:199','cur'],
 ['F2','q','turn-on causes: a new cause closes the alert','alert_ops.py:62','acc'],
 ['F3','q','voltage event on a shovelled queue','alert_ops.py:223','ref'],
 ['F4','s','copy of acknowledge_alerts with one filter','alert_ops.py:263','acc'],
 ['F5','s','loads the whole alert history of the car','alert_ops.py:297','todo'],
 ['F6','s','repeats the last-alert lookup, no status check','history_steps.py:58','todo'],
 ['F7','s','three paths without a scenario','alerts.feature','todo'],
 ['F8','n','three wording nits','alert_ops.py:364','todo'],
 ['F9','g','history entries keep last_modified_by','alert_ops.py:371','acc'],
]
const SV={q:'question',s:'suggestion',n:'nit',g:'praise'}
const WHY='If Recovered (10:05) is handled before its Failed (10:00), the recovery finds no alert. The late failure then opens one that stays open on a car whose power is fine, until the next recovery.'
const POST='Question: what happens if the Recovered event is processed before its Failed (retry, redelivery)? The recovery acknowledges nothing, then the late failure opens an alert that stays open until the next recovery. Does the vendor guarantee ordering on this queue?'
const L=(n,h,k='')=>`<div class="ln add ${k}"><span class="pl">+</span><span class="n">${n}</span><span class="m">+</span><span>${h}</span></div>`
const fold=t=>`<div class="fold">⋯ ${t}</div>`
const sev=s=>`<span class="sev ${s}">${SV[s]}</span>`
const acts=(sm)=>`<div class="acts"><span class="btn2 p">✓ Accept</span><span class="btn2">✕ Refuse</span><span class="btn2">✎ Edit</span><span class="btn2">💬 Ask crow</span>${sm?'':'<span class="mu" style="margin-left:auto;align-self:center;font-size:11.5px">pattern: event ordering · seen 2x</span>'}</div>`
const thF1=(ph)=>`<div class="th open"><div class="hd"><span class="av c">C</span><span class="who">crow · F1</span>${sev('q')}<span class="r mu">to decide</span></div><div class="bd"><div class="why">${WHY}</div><div class="quote"><small>Comment that will be posted</small>${POST}</div>${acts(ph)}</div></div>`
const thMini=(id,s,t,st)=>`<div class="th mini"><div class="hd"><span class="av c">C</span><span class="who">crow · ${id}</span>${sev(s)}<span>${t}</span><span class="r ${st==='acc'?'ok':'mu'}">${st==='acc'?'✓ will post':'✕ dropped'} · <span class="ac">change</span></span></div></div>`
const thYou=()=>`<div class="th" style="border-color:var(--w)"><div class="hd"><span class="av y">Y</span><span class="who">your comment · line 226</span><span class="r mu">draft</span></div><div class="bd"><div class="ta">Is the voltage alert acknowledged when the car gets archived? I don't see it in the archived path.<span class="ac">|</span></div><div class="acts"><span class="btn2 p">🔍 Ask crow to check</span><span class="btn2">Add as my comment</span><span class="btn2 g">Cancel</span><span class="mu" style="margin-left:auto;align-self:center;font-size:11.5px">crow checks the code and drafts a finding</span></div></div></div>`
const diff=(ph)=>`<div class="file"><div class="fhd"><span>▾</span><span>lambda_layer/domain/car/<b style="font-weight:500">alert_ops.py</b></span><span class="ok">+412</span><span class="er">−3</span><span class="mu">F2 F1 F3 · 2 of 3 decided</span></div>
${fold('lines 1-58')}${L(60,'<span class="cm"># Restarts the backup battery can power</span>')}${L(62,'POWER_KEEPING_TURN_ON_CAUSES = {<span class="str">"WATCHDOG"</span>, <span class="str">"PLANNED_REBOOT"</span>}')}${thMini('F2','q','a new cause closes the alert','acc')}
${fold('lines 63-196')}${L(197,'    occurred_at = event.occurred_at <span class="kw">or</span> now()')}${L(199,'    <span class="kw">if</span> event_type == POWER_SUPPLY_RECOVERED:','hit')}${thF1(ph)}${L(200,'        <span class="fn">_acknowledge_power_alerts</span>(car, POWER_SUPPLY_FAILED,')}${L(201,'            ended_at=occurred_at)  <span class="cm"># only alerts triggered before</span>')}${L(202,'        <span class="kw">return</span>')}
${fold('lines 203-222')}${L(223,'    <span class="kw">if</span> event_type == SUPPLY_VOLTAGE_THRESHOLD_CROSSED:')}${thMini('F3','q','voltage event on a shovelled queue','ref')}${L(224,'        status = event_data.get(<span class="str">"threshold_status"</span>)')}${L(226,'        <span class="kw">if</span> status == <span class="str">"BELOW_THRESHOLD"</span>:','hov')}${thYou()}${L(227,'            <span class="fn">create_alert_on_event</span>(car, VOLTAGE_LOW, occurred_at)')}</div>`
const summary=(full)=>`<div class="card"><div class="crumb"><a>‹ MRs</a> · to review · api</div><div class="ttl"><span class="ref">!245</span> Power supply alerts from the telematic box</div>
<div class="meta2"><span><b>dev-b</b> wants to merge <b>power-alerts</b> into <b>main</b></span><span>CI <span class="ok">✓ passed</span></span><span>approvals 0/1</span><span>+612 −14 · 6 files</span><span>reviewed by crow 9:41</span></div>
${full?`<div class="sumg"><div><div class="what">Turns the box's power events into car alerts. Archived cars get none. An offline alert gets a note when the box lost its power first.</div>
<table class="ev"><tr><td>PowerSupplyFailed</td><td>opens POWER_SUPPLY_FAILED unless one is open or a later one exists</td></tr><tr><td>PowerSupplyRecovered</td><td>acknowledges the failures triggered before it</td></tr><tr><td>TurnedOn</td><td>same, except causes WATCHDOG and PLANNED_REBOOT</td></tr><tr><td>VoltageThresholdCrossed</td><td>BELOW opens a voltage alert, ABOVE acknowledges it</td></tr></table></div>
