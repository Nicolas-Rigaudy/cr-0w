# Mockup pages for a visual change. Approval only from the logged-in nest page.
name: design
schema_version: 1
phase: 1
purpose: Render mockup options for a visual change and loop on the owner's picks.
skill: {name: null, status: missing, fallbacks: []}
key: {format: slug, pattern: "^[a-z0-9][a-z0-9-]{2,40}$", example: nest-inbox-screen}
scopes: [work, personal, crow]
data_classes: [work, personal]
gates: [mockup]
autonomy: ask
account: {route: scope, model: opus, subagent_model: sonnet}
effort: medium
caps: {time_min: 60, budget_usd: 8, resumes: 2, rounds: 5, outbox_file_mb: 20, outbox_total_mb: 200}
permission: workspace-write
worktree: true
outputs: [mockup.vN.md, outbox/]
publish: {actions: [commit-docs, next-mission], needs_validation: true}
preflight:
  - {id: options, text: "How many options?", choices: ["2", "3", "4"], safest: "3"}
  - {id: states, text: "Which screens and states?", safest: main state at phone and desktop width}
  - {id: rules, text: "Design rules to follow?", safest: the repo's design rules file}
