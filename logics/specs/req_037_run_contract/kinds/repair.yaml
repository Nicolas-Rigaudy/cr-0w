# Rebase a branch or fix a red pipeline from the repair catalogue. 2 rounds, then ask.
name: repair
schema_version: 1
phase: 3
purpose: "Keep a branch alive: rebase, rerun checks, apply a known fix."
absorbs: [rebase, ci-repair]
skill: {name: null, status: missing}
key: {format: mr, pattern: "^[a-z0-9-]+([!#][0-9]+|@[A-Za-z0-9._/-]+)$", example: "api!398"}
scopes: [work, personal, crow]
data_classes: [work, personal]
gates: [report]
autonomy: notify
account: {route: scope, model: sonnet, subagent_model: haiku}
effort: medium
caps: {time_min: 45, budget_usd: 6, resumes: 1, rounds: 2, outbox_file_mb: 5, outbox_total_mb: 20}
permission: workspace-write
worktree: true
outputs: [report.vN.md]
publish: {actions: [push], needs_validation: true}
preflight: []
by_scope:
  personal: {gates: [], autonomy: auto, publish: {actions: [push], needs_validation: false}, sensitive_paths_ask: true}
  crow: {gates: [], autonomy: auto, publish: {actions: [push], needs_validation: false}, sensitive_paths_ask: true}
