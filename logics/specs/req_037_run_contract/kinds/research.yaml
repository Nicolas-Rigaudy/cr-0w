# Read-only study that ends with a report. No gate: the report lands as an FYI; `dig` reopens the mission.
name: research
schema_version: 1
phase: 1
purpose: Find out and report; changes nothing.
skill: {name: null, status: missing}
key: {format: slug, pattern: "^[a-z0-9][a-z0-9-]{2,40}$", example: android-push-options}
scopes: [work, personal, crow]
data_classes: [work, personal]
gates: []
autonomy: auto
account: {route: any-allowed, model: opus, subagent_model: sonnet}
effort: medium
caps: {time_min: 60, budget_usd: 5, resumes: 2, rounds: 3, outbox_file_mb: 20, outbox_total_mb: 100}
permission: read-only
worktree: false
outputs: [report.vN.md]
publish: {actions: [none], needs_validation: false}
preflight:
  - {id: depth, text: "How deep should it go?", choices: [quick, standard, thorough], safest: standard}
  - {id: sources, text: "Sources it must read or skip?", safest: "web, the repos named in the goal, the vault"}
  - {id: language, text: "Report language?", choices: [English, French], safest: English}
