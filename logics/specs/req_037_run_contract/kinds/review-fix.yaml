# Address review threads on the owner's MR. Auto up to a local commit when every thread matches a ledger pattern.
# Personal repos: fixes push on their own; reply texts are public, so they wait for an ok.
name: review-fix
schema_version: 1
phase: 2
purpose: Fix the review threads on the owner's MR and draft the replies.
skill: {name: review-threads, status: exists, fallbacks: [review]}
key: {format: mr, pattern: "^[a-z0-9-]+[!#][0-9]+$", example: "api!398"}
scopes: [work, personal]
data_classes: [work, personal]
gates: [report]
autonomy: auto
account: {route: scope, model: opus, subagent_model: sonnet}
effort: high
caps: {time_min: 90, budget_usd: 15, resumes: 2, rounds: 3, outbox_file_mb: 5, outbox_total_mb: 20}
permission: workspace-write
worktree: true
outputs: [report.vN.md, outbox/diff.patch]
publish: {actions: [push, reply-resolve], needs_validation: true}
preflight:
  - {id: skip, text: "Threads to leave alone?", safest: none}
by_scope:
  personal: {gates: [], autonomy: auto, publish: {actions: [push, reply-resolve], needs_validation: false, ask_actions: [reply-resolve]}}
