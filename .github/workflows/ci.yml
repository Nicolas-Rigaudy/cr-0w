name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/crow-deck/go.mod
          cache-dependency-path: tools/*/go.sum
      - name: Install dependencies
        run: python -m pip install pytest pyyaml markdown
      - name: Release gate
        run: python bin/crow-check
      - name: Go tests
        run: |
          for d in tools/crow-deck tools/crow-watch; do
            (cd "$d" && go vet ./... && go test ./...)
          done
